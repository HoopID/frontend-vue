server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos con hash en el nombre: se pueden cachear mucho tiempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Vue Router (modo history): cualquier ruta devuelve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
